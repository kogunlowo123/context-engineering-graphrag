name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: Lint and format
        run: |
          uv run ruff check src tests
          uv run black --check src tests
      - name: Type check
        run: uv run mypy
      - name: Static security analysis
        run: uv run python -m bandit -q -r src -c pyproject.toml
      - name: Published contracts are current
        run: uv run python -m context_engineering_graphrag.contracts --check
      - name: Unit, security, chaos, performance and e2e tests (coverage gate 90%)
        run: uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: graphrag
          POSTGRES_USER: graphrag
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U graphrag" --health-interval 5s --health-retries 10
    env:
      GRAPHRAG_TEST_DATABASE_URL: postgresql+asyncpg://graphrag:ci-only@localhost:5432/graphrag
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - name: PostgreSQL and pgvector integration tests (must run, not skip)
        run: |
          set -o pipefail
          uv run pytest tests/integration -m integration --no-cov -ra | tee integration.log
          grep -Eq '[0-9]+ passed' integration.log
          ! grep -Eq '[0-9]+ skipped' integration.log

  deploy-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Helm lint and render
        run: |
          helm lint deployments/helm/context-engineering-graphrag \
            -f deployments/helm/context-engineering-graphrag/ci/test-values.yaml
          helm template rag deployments/helm/context-engineering-graphrag \
            -f deployments/helm/context-engineering-graphrag/ci/test-values.yaml > rendered.yaml
          if helm template rag deployments/helm/context-engineering-graphrag > /dev/null 2>&1; then
            echo "chart rendered without required values"; exit 1
          fi
      - name: Kubernetes schema validation (kubeconform)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml deployments/kubernetes/namespace.yaml deployments/kubernetes/external-secrets.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt and validate (aws, azure, gcp)
        run: |
          terraform fmt -recursive -check deployments/terraform
          for cloud in aws azure gcp; do
            terraform -chdir=deployments/terraform/$cloud init -backend=false -input=false
            terraform -chdir=deployments/terraform/$cloud validate
          done
      - name: IaC and Kubernetes misconfiguration scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: deployments
          severity: HIGH,CRITICAL
          exit-code: "1"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t context-engineering-graphrag:ci .
      - name: Container smoke test (starts, reports healthy)
        run: |
          docker run -d --name graphrag -p 8080:8080 \
            -e GRAPHRAG_ENVIRONMENT=ci \
            -e GRAPHRAG_PUBLIC_URL=http://localhost:8080 \
            -e GRAPHRAG_DATABASE_URL=sqlite+aiosqlite:////tmp/graphrag.db \
            -e GRAPHRAG_AUDIT_LOG_PATH=/tmp/audit.jsonl \
            -e GRAPHRAG_EMBEDDING_PROVIDER=hashing -e GRAPHRAG_EMBEDDING_DIMENSION=384 \
            -e GRAPHRAG_LOCAL_ISSUER=https://login.ci.internal \
            -e GRAPHRAG_LOCAL_AUDIENCE=context-engineering-graphrag \
            -e GRAPHRAG_LOCAL_JWKS_URL=https://login.ci.internal/jwks \
            context-engineering-graphrag:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/readyz && break; sleep 1
          done
          curl -sf http://localhost:8080/readyz | grep -q ready
          curl -sf http://localhost:8080/.well-known/agent-card.json | grep -q '"protocolVersion":"0.3.0"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/collections)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp -H 'content-type: application/json' -d '{}')" = 401
          curl -sf http://localhost:8080/metrics | grep -q graphrag_http_request_duration_seconds
          docker inspect --format '{{.Config.User}}' context-engineering-graphrag:ci | grep -q 10001
          docker logs graphrag
      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: context-engineering-graphrag:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Image SBOM (Syft)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: context-engineering-graphrag:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: SBOM vulnerability gate (Grype)
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/python --config p/secrets --config p/dockerfile --error --metrics=off src Dockerfile
