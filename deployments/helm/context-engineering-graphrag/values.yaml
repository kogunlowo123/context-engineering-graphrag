replicaCount: 3

image:
  repository: ghcr.io/kogunlowo123/context-engineering-graphrag
  tag: ""  # defaults to .Chart.AppVersion
  digest: ""  # set to pin an immutable sha256 digest; takes precedence over tag
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: context-engineering-graphrag
  # Cloud workload identity bindings, e.g.
  #   eks.amazonaws.com/role-arn (AWS IRSA; Bedrock access)
  #   azure.workload.identity/client-id (Azure Workload ID)
  #   iam.gke.io/gcp-service-account (GKE Workload Identity)
  annotations: {}

podLabels: {}

# Deployment-specific values marked REQUIRED have no default; the chart
# refuses to render until they are set (helm install --values <env>.yaml).
graphrag:
  environment: production
  publicUrl: ""  # REQUIRED: external HTTPS URL (A2A Agent Card, MCP Host check)
  identityFabricUrl: ""  # REQUIRED: agent-identity-fabric base URL
  vectorBackend: pgvector  # memory | pgvector
  embedding:
    provider: bedrock  # bedrock | openai_compatible
    model: amazon.titan-embed-text-v2:0
    dimension: 1024
    awsRegion: ""  # REQUIRED for provider=bedrock
    baseUrl: ""  # REQUIRED for provider=openai_compatible
    auth: bearer
    apiKeyEnv: ""  # variable name inside secrets.providerEnv holding the key
  reranker:
    kind: lexical  # lexical | http
    url: ""  # REQUIRED for kind=http, e.g. a Text Embeddings Inference rerank service
    model: BAAI/bge-reranker-v2-m3
  generator: extractive  # extractive | model
  extractor: pattern  # pattern | model
  summarizer: extractive  # extractive | model
  judge: lexical  # lexical | model
  chunking:
    strategy: recursive
    maxTokens: 256
    overlapTokens: 32
  resolutionThreshold: "0.88"
  logLevel: INFO
  otlpEndpoint: ""  # optional OTLP gRPC endpoint

# Secrets are created by the platform secret operator (External Secrets,
# Secrets Store CSI) from the cloud secret manager provisioned by Terraform.
secrets:
  # Secret holding key DATABASE_URL (postgresql+asyncpg://...).
  database: context-engineering-graphrag-database
  # Secret holding audit-<kid>.pem, the Ed25519 audit signing key.
  auditKey: context-engineering-graphrag-audit-key
  auditKeyFile: ""  # REQUIRED: file name of the audit key within secrets.auditKey
  # Optional secret exposed as environment variables: provider prices, endpoints
  # and keys referenced by configs/providers.yaml (see docs/operations/configuration.md).
  providerEnv: ""

audit:
  storageClassName: ""
  size: 20Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""  # required when ingress.enabled
  tlsSecret: context-engineering-graphrag-tls
  annotations: {}

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  # Namespaces whose agents may call the platform.
  allowedNamespaceLabels:
    agent-platform/member: "true"
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: observability
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx

serviceMonitor:
  enabled: false
  interval: 30s

nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
