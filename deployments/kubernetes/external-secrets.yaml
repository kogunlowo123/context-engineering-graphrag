# Syncs platform secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: context-engineering-graphrag-database
  namespace: context-engineering
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: context-engineering-graphrag-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: context-engineering-graphrag-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: context-engineering-graphrag-audit-key
  namespace: context-engineering
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: context-engineering-graphrag-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^context-engineering-graphrag-audit-key-"
      rewrite:
        - regexp:
            source: "^context-engineering-graphrag-audit-key-(.*)$"
            target: "audit-$1.pem"
---
# Provider settings referenced by configs/providers.yaml (prices, endpoints,
# keys). One remote secret per variable, named
# context-engineering-graphrag-env-<VARIABLE_NAME>.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: context-engineering-graphrag-providers
  namespace: context-engineering
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: context-engineering-graphrag-providers
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^context-engineering-graphrag-env-"
      rewrite:
        - regexp:
            source: "^context-engineering-graphrag-env-(.*)$"
            target: "$1"
